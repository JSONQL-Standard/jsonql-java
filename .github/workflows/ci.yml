name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [17, 21]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: maven

      - name: Compile
        run: mvn -q compile

      - name: Run tests
        run: mvn -q test

      - name: Package
        run: mvn -q package -Dmaven.test.skip=true

  integration:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jsonql
          POSTGRES_PASSWORD: password
          POSTGRES_DB: jsonql_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jsonql"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    strategy:
      fail-fast: false
      matrix:
        adapter:
          - name: java-spring-boot-simple
            port: 8080
            test-path: tests/unified
            build: mvn -q spring-boot:run
            type: spring-boot
          - name: java-spring-boot-lifecycle
            port: 8081
            test-path: tests/unified/lifecycle
            build: mvn -q spring-boot:run
            type: spring-boot
          - name: java-jakarta-ee-simple
            port: 8082
            test-path: tests/unified
            build: mvn -q clean package payara-micro:bundle && java -jar target/*-microbundle.jar --nocluster --port $PORT --postbootcommandfile postboot.txt
            type: jakarta-ee
          - name: java-jakarta-ee-lifecycle
            port: 8083
            test-path: tests/unified/lifecycle
            build: mvn -q clean package payara-micro:bundle && java -jar target/*-microbundle.jar --nocluster --port $PORT --postbootcommandfile postboot.txt
            type: jakarta-ee

    steps:
      - uses: actions/checkout@v4
        with:
          path: jsonql-java

      - uses: actions/checkout@v4
        with:
          repository: JSONQL-Standard/jsonql-tests
          token: ${{ secrets.JSONQL_TESTS_TOKEN }}
          path: jsonql-tests

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner dependencies
        run: pip install -r jsonql-tests/requirements.txt

      - name: Install jsonql-java to local Maven repo
        run: |
          cd jsonql-java
          mvn -q install -Dmaven.test.skip=true

      - name: Install java-shared to local Maven repo
        run: |
          cd jsonql-java
          JSONQL_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Syncing jsonql-java version to $JSONQL_VERSION in all Java adapters"
          for dir in java-shared ${{ matrix.adapter.name }}; do
            cd ${{ github.workspace }}/jsonql-tests/integration-tests/$dir
            mvn versions:use-dep-version -Dincludes=org.jsonql:jsonql-java -DdepVersion="$JSONQL_VERSION" -DforceVersion=true -q
          done
          cd ${{ github.workspace }}/jsonql-tests/integration-tests/java-shared
          mvn -q install -Dmaven.test.skip=true

      - name: Start ${{ matrix.adapter.name }}
        run: |
          cd jsonql-tests/integration-tests/${{ matrix.adapter.name }}
          DB_TYPE=postgres \
          SPRING_DATASOURCE_URL="jdbc:postgresql://localhost:5432/jsonql_test" \
          SPRING_DATASOURCE_USERNAME=jsonql \
          SPRING_DATASOURCE_PASSWORD=password \
          JSONQL_SCHEMA_PATH="${{ github.workspace }}/jsonql-tests/fixtures/standard/schema.json" \
          PORT=${{ matrix.adapter.port }} \
          bash -c '${{ matrix.adapter.build }}' > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid

          # Wait for server to be ready (Java apps need longer startup)
          # Payara Micro restarts the HTTP listener during WAR deployment,
          # so we need to wait for the app-level endpoint, not just /health
          for i in $(seq 1 60); do
            if curl -s http://localhost:${{ matrix.adapter.port }}/health 2>/dev/null | grep -q status; then
              echo "Health endpoint responding on port ${{ matrix.adapter.port }}"
              # Give the app time to fully deploy (Payara restarts the listener)
              sleep 5
              break
            fi
            if ! kill -0 $(cat /tmp/server.pid) 2>/dev/null; then
              echo "Server process died. Logs:"
              cat /tmp/server.log
              exit 1
            fi
            sleep 3
          done

          # Final check with retries (Payara listener may still be restarting)
          for attempt in $(seq 1 5); do
            if curl -sf http://localhost:${{ matrix.adapter.port }}/health > /dev/null 2>&1; then
              echo "Server confirmed ready on port ${{ matrix.adapter.port }}"
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Server failed to start. Logs:"
              cat /tmp/server.log
              exit 1
            fi
            sleep 3
          done

      - name: Run compliance tests against ${{ matrix.adapter.name }}
        run: |
          cd jsonql-tests
          python -m pytest tests/ \
            --target=http://localhost:${{ matrix.adapter.port }} \
            --db-type=postgres \
            --db-dsn="postgresql://jsonql:password@localhost:5432/jsonql_test?sslmode=disable" \
            --test-path=${{ matrix.adapter.test-path }} \
            -q --tb=short

      - name: Dump server logs on failure
        if: failure()
        run: |
          echo "=== Server logs ==="
          cat /tmp/server.log 2>/dev/null || echo "No logs found"
